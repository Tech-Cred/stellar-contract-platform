[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "observatory-client"
version = "0.1.0"
description = "Typed Python client for the Stellar Contract Observatory REST API"
requires-python = ">=3.11"
dependencies = []
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["observatory_client"]
strict = true
